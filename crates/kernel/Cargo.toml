[package]
name = "solidcraft-kernel"
description = "SolidCraft B-rep kernel boundary: solids, extrude/revolve/booleans/fillets, meshes, measures and STEP, behind our own API (implemented with SMLib)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smlib"]
# The kernel's backend: exactly one of the two (src/lib.rs refuses to build with both or
# neither). Both give crate::backend the same API.
# NVIDIA's SMLib (tangency-labs/smlib), linked; needs a C++ toolchain and scripts/fetch-smlib.sh
# (ADR 0002).
smlib = ["dep:solidcraft-smlib", "solidcraft-smlib/native"]
# solidcore (tangency-labs/solidcore), the pure-Rust port of SMLib: it answers what it does not
# do yet as not supported (crates/solidcore).
solidcore = ["dep:solidcraft-solidcore"]

[dependencies]
solidcraft-geom = { workspace = true }
solidcraft-smlib = { workspace = true, optional = true }
solidcraft-solidcore = { workspace = true, optional = true }
solidcraft-profile = { workspace = true }
solidcraft-step = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
spade = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
solidcraft-profile = { workspace = true, features = ["enabled"] }
proptest = { version = "1", default-features = false, features = ["std"] }
