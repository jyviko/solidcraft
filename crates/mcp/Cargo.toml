[package]
name = "solidcraft-mcp"
description = "SolidCraft MCP server: JSON-RPC 2.0 over stdio, driving a headless session or the running app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smlib"]
# The kernel's backend (solidcraft-engine): one of the two, as the apps pass it down (crates/kernel).
smlib = ["solidcraft-engine/smlib"]
solidcore = ["solidcraft-engine/solidcore"]

[dependencies]
solidcraft-engine = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The renderer `solidcraft-cli mcp` installs, so the tests' screenshots are drawn as the server's.
solidcraft-gpu = { workspace = true }
