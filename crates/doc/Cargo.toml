[package]
name = "solidcraft-doc"
description = "SolidCraft document model: parameters and expressions, sketches and features on a parametric timeline, incremental evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["smlib"]
# The kernel's backend (solidcraft-kernel): one of the two, as the apps pass it down (crates/kernel).
smlib = ["solidcraft-kernel/smlib"]
solidcore = ["solidcraft-kernel/solidcore"]

[dependencies]
solidcraft-geom = { workspace = true }
solidcraft-sketch = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-profile = { workspace = true }
solidcraft-render = { workspace = true }
solidcraft-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
